[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arg-options"
version = "0.1.0"
description = "Opciones BYMA via PPI: cadena, Greeks, screening, diario, alertas, órdenes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ppi-client>=1.2.4",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "requests>=2.28.0",
  "rich>=13.0.0",
  "textual>=0.80.0",
]

[project.scripts]
arg-options = "arg_options.tui_launcher:main"



[project.optional-dependencies]
dev = []
testing = []
cli = []

[tool.setuptools.packages.find]
where = ["."]
include = ["arg_options*"]
