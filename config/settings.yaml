# Solo Grupo Financiero Galicia: opciones BYMA (raíz GFG) y spot GGAL en PPI.

ppi:
  market: "Byma"
  instrument_type_options: "OPCIONES"
  instrument_type_equity: "ACCIONES"
  default_settlement: "A-48HS"

# Raíz del ticker de opción BYMA (letras antes de C o V) -> ticker de la acción en PPI para el spot.
# Ejemplo documentado: GFGC2800MY es call sobre Galicia; el spot se pide como GGAL.
underlying_spot:
  GFG: "GGAL"

risk_free_rate: 0.45
contract_multiplier: 100

paths:
  database: "data/arg_options.db"
  snapshot_export_parquet: "data/last_chain.parquet"
  screening: "config/screening.yaml"
  discovery_rules: "config/discovery_rules.yaml"

chain:
  option_roots:
    - GFG
