# Copiar a config/settings.yaml. Editar según tu subyacente y criterio.

ppi:
  market: "Byma"
  instrument_type_options: "OPCIONES"
  instrument_type_equity: "ACCIONES"
  default_settlement: "A-48HS"

# Mapeo ticker de opción (prefijo BYMA) → ticker spot
underlying_spot:
  GFG: "GGAL"

# Tasa anual continua para IV / Greeks
risk_free_rate: 0.45

# Multiplicador de contratos (nominales por contrato)
contract_multiplier: 100

paths:
  database: "data/arg_options.db"
  snapshot_export_parquet: "data/last_chain.parquet"
  screening: "config/screening.yaml"

chain:
  # Prefijos a incluir en la cadena (uno por subyacente)
  option_roots:
    - GFG
