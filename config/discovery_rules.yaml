# Discovery Engine — configuración de estrategias
# Extiende los filtros de screening.yaml con parámetros específicos por estrategia.

auto_chain_if_stale: true
chain_stale_minutes: 30
min_confidence: 30

strategies:
  mariposa:
    enabled: true
    target_delta: 0.50
    delta_range: [0.30, 0.70]
    max_cost_pct_of_width: 50

  renta_ic:
    enabled: true
    short_delta_target: 0.20
    short_delta_range: [0.15, 0.30]
    insurance_delta_target: 0.10
    insurance_delta_range: [0.05, 0.15]
    min_credit_pct_of_width: 5

  temporal:
    enabled: true
    min_dte_short: 7
    max_dte_short: 30
    min_dte_long: 45
    max_dte_long: 90

  sintetico:
    enabled: true
