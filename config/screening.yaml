# Filtros de pantalla (todos opcionales; se omiten si no están)

screening:
  dte_min: 0          # At least 0 days to expiry (allow all)
  dte_max: 60         # Max 60 days 
  volume_min: 0       # Allow zero volume (common in stored data)
  max_spread_pct: 1.0 # Max 100% spread (very permissive for stored data)
  delta_min: -1.0     # Allow all delta values (stored data has mostly zeros)
  delta_max: 1.0     # Allow all delta values

alerts:
  min_interval_seconds: 3600
  near_expiry_days: 7
